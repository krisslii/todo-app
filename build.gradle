plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.6'
    id 'maven-publish'
}

group = 'org.example'
version = providers.gradleProperty('version').get()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

tasks.named('jar') {
    archiveClassifier.set('plain')
}

tasks.named('shadowJar') {
    archiveBaseName.set('todo-app')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest {
        attributes 'Main-Class': 'org.example.TodoApp'
    }
    mergeServiceFiles()
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'todo-app'
            artifact(tasks.named('shadowJar'))
            pom {
                name = 'Todo App'
                description = 'Console task list for a GitHub Actions practice'
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            def repository = System.getenv('GITHUB_REPOSITORY') ?: 'OWNER/todo-app'
            url = uri("https://maven.pkg.github.com/${repository.toLowerCase()}")
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
